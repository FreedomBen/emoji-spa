name: emoji_spa
description: "Emoji Spa — cross-platform emoji picker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/emoji-categories.json
    - assets/emoji-cldr.json
    - assets/emoji-slack.json

  # fonts:
  #   - family: NotoColorEmoji
