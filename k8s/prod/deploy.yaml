apiVersion: v1
kind: Namespace
metadata:
  name: emoji-spa-prod
  labels:
    app: emoji-spa
    env: prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-spa-web
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    tier: web
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emoji-spa
      tier: web
      env: prod
  template:
    metadata:
      labels:
        app: emoji-spa
        tier: web
        env: prod
    spec:
      containers:
        - name: web
          image: docker.io/freedomben/emoji-spa-web:${RELEASE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: emoji-spa-web
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    tier: web
    env: prod
spec:
  selector:
    app: emoji-spa
    tier: web
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: emoji-spa-gateway
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    env: prod
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: emoji.spa
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emoji-spa
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    tier: web
    env: prod
spec:
  parentRefs:
    - name: emoji-spa-gateway
  hostnames:
    - emoji.spa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: emoji-spa-web
          port: 80

---
apiVersion: domain-name-operator.tamx.org/v1
kind: CloudflareDnsRecord
metadata:
  name: emoji-spa
  labels:
    app: emoji-spa
    tier: web
    env: prod
    kind: cloudflarednsrecord
  namespace: emoji-spa-prod
spec:
  hostName: emoji.spa
  zoneId: 966b989896294a029264967616c56c96
  serviceName: emoji-spa-web
  proxied: true
