apiVersion: v1
kind: Namespace
metadata:
  name: emoji-spa-prod
  labels:
    app: emoji-spa
    env: prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-spa-web
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    tier: web
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emoji-spa
      tier: web
      env: prod
  template:
    metadata:
      labels:
        app: emoji-spa
        tier: web
        env: prod
    spec:
      containers:
        - name: web
          image: docker.io/freedomben/emoji-spa-web:${RELEASE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: emoji-spa-web
  namespace: emoji-spa-prod
  labels:
    app: emoji-spa
    tier: web
    env: prod
spec:
  type: ClusterIP
  selector:
    app: emoji-spa
    tier: web
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: http
