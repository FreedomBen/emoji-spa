name: Test and Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

  build:
    name: Build Release Bundles
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image with bundles
        run: docker build -t emoji-spa-builder .

      - name: Extract artifacts from image
        run: |
          container_id=$(docker create emoji-spa-builder)
          mkdir -p build-artifacts
          docker cp "$container_id":/artifacts ./build-artifacts
          docker rm "$container_id"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: emoji-spa-linux-bundles
          path: build-artifacts/**
