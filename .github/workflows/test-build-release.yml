name: Test Build Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ github.sha }}

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

  e2e-container:
    name: Run E2E Tests Against Web Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run container E2E tests
        env:
          CONTAINER_TOOL: docker
        run: make test-e2e-container

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-container-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    name: Build Release Bundles
    runs-on: ubuntu-latest
    needs: [tests, e2e-container]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build web bundle
        run: npm run build:web

      - name: Package web artifact
        run: |
          rm -f web-dist.zip
          cd dist && zip -qr ../web-dist.zip .

      - name: Build & package extensions
        run: make extension-pack

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-app-dist
          path: web-dist.zip

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v6
        with:
          name: browser-extensions
          path: |
            extension-dist/chrome.zip
            extension-dist/firefox.zip

      - name: Build bundles via container script
        env:
          CONTAINER_RUNTIME: docker
          APPEND_SHORT_SHA: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: ./build_in_container.sh

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: emoji-spa-linux-bundles
          path: build-artifacts/**

  build-windows:
    name: Build Windows Bundle
    runs-on: windows-latest
    needs: [tests, e2e-container]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build web bundle
        run: npm run build:web

      - name: Build Windows bundle
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: emoji-spa-windows-bundle
          path: src-tauri/target/release/bundle

  build-macos:
    name: Build macOS Bundle
    runs-on: macos-latest
    needs: [tests, e2e-container]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build web bundle
        run: npm run build:web

      - name: Build macOS bundle
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload macOS bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: emoji-spa-macos-bundle
          path: src-tauri/target/release/bundle

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v6
        with:
          name: emoji-spa-linux-bundles
          path: release-artifacts

      - name: Download web artifact
        uses: actions/download-artifact@v6
        with:
          name: web-app-dist
          path: release-artifacts/web

      - name: Download extension artifacts
        uses: actions/download-artifact@v6
        with:
          name: browser-extensions
          path: release-artifacts/extensions

      - name: Download Windows bundle artifact
        uses: actions/download-artifact@v6
        with:
          name: emoji-spa-windows-bundle
          path: release-artifacts/windows

      - name: Download macOS bundle artifact
        uses: actions/download-artifact@v6
        with:
          name: emoji-spa-macos-bundle
          path: release-artifacts/macos

      - name: List downloaded artifacts
        run: ls -R release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/bundle/appimage/*.AppImage
            release-artifacts/bundle/deb/*.deb
            release-artifacts/bundle/rpm/*.rpm
            release-artifacts/web/web-dist.zip
            release-artifacts/extensions/chrome.zip
            release-artifacts/extensions/firefox.zip
            release-artifacts/windows/**/msi/*.msi
            release-artifacts/windows/**/nsis/*.exe
            release-artifacts/macos/**/dmg/*.dmg

  #deploy-staging:
  #  runs-on: ubuntu-latest
  #  needs: [build, test]
  #  concurrency: deploy_staging_mutex
  #  #if: ${{ endsWith(github.ref, 'main') || endsWith(github.ref, '') }}
  #  env:
  #    ENV: staging
  #    K8S_SERVER: ${{ secrets.K8S_ENDPOINT_STAGING }}
  #    K8S_TOKEN: ${{ secrets.K8S_TOKEN_STAGING }}
  #    K8S_CA_CERT: ${{ secrets.K8S_CA_CERT_STAGING }}
  #    SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
  #    SLACK_CHANNEL: "#connect-bots"

  #  steps:
  #    - name: Checkout
  #      uses: actions/checkout@v6

  #    - name: Render Manifests
  #      run: ./scripts/deploy-release.sh --save-deploy --manifest-dir "manifests-${RELEASE_VERSION}-${ENV}" --debug

  #    - name: Archive Rendered Kubernetes Manifests
  #      uses: actions/upload-artifact@v6
  #      with:
  #        name: "manifests-${{ env.RELEASE_VERSION }}-${{ env.ENV }}"
  #        path: "manifests-${{ env.RELEASE_VERSION }}-${{ env.ENV }}"

  #    #- name: Run migrations
  #    #  run: ./scripts/deploy-release.sh --apply-migration --manifest-dir "manifests-${RELEASE_VERSION}-${ENV}" --debug

  #    - name: Deploy new version
  #      run: ./scripts/deploy-release.sh --apply-deploy --manifest-dir "manifests-${RELEASE_VERSION}-${ENV}" --debug

  deploy-prod:
    runs-on: ubuntu-latest
    #needs: [build, tests, deploy-staging]
    needs: [build, tests, e2e-container]
    concurrency: deploy_prod_mutex
    #if: ${{ startsWith(github.ref, 'refs/tags/prod-') }}
    env:
      ENV: prod
      K8S_SERVER: ${{ secrets.K8S_ENDPOINT_PROD }}
      K8S_TOKEN: ${{ secrets.K8S_TOKEN_PROD }}
      K8S_CA_CERT: ${{ secrets.K8S_CA_CERT_PROD }}
      #SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      #SLACK_CHANNEL: "#connect-bots"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render Manifests
        run: ./scripts/deploy-release.sh --save-deploy --manifest-dir "manifests-${RELEASE_VERSION}-${ENV}" --debug

      - name: Archive Rendered Kubernetes Manifests
        uses: actions/upload-artifact@v6
        with:
          name: "manifests-${{ env.RELEASE_VERSION }}-${{ env.ENV }}"
          path: "manifests-${{ env.RELEASE_VERSION }}-${{ env.ENV }}"

      #- name: Run migrations
