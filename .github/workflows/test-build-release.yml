name: Test Build Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

  build:
    name: Build Release Bundles
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build web bundle
        run: npm run build:web

      - name: Package web artifact
        run: |
          rm -f web-dist.zip
          cd dist && zip -qr ../web-dist.zip .

      - name: Build & package extensions
        run: make extension-pack

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: web-dist.zip

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            extension-dist/chrome.zip
            extension-dist/firefox.zip

      - name: Build bundles via container script
        env:
          CONTAINER_RUNTIME: docker
        run: ./build_in_container.sh

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: emoji-spa-linux-bundles
          path: build-artifacts/**

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: emoji-spa-linux-bundles
          path: release-artifacts

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-dist
          path: release-artifacts/web

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-extensions
          path: release-artifacts/extensions

      - name: List downloaded artifacts
        run: ls -R release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/bundle/appimage/*.AppImage
            release-artifacts/bundle/deb/*.deb
            release-artifacts/bundle/rpm/*.rpm
            release-artifacts/web/web-dist.zip
            release-artifacts/extensions/chrome.zip
            release-artifacts/extensions/firefox.zip
