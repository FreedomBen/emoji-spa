<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emoji Spa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 class="app-title">
          <img
            src="assets/emoji-spa-logo-light.png"
            alt="Emoji Spa logo"
            class="app-logo app-logo-light"
          />
          <img
            src="assets/emoji-spa-logo-dark.png"
            alt="Emoji Spa logo"
            class="app-logo app-logo-dark"
          />
          <span class="app-title-text">Emoji Spa</span>
        </h1>
        <p id="status">Generating emoji list...</p>
        <div class="controls">
          <input
            id="searchInput"
            type="search"
            placeholder="Search by emoji or category…"
            autocomplete="off"
          />
          <select id="categorySelect">
            <option value="all">All categories</option>
          </select>
          <label class="toggle">
            <input id="groupByCategory" type="checkbox" checked />
            <span>Group by category</span>
          </label>
        </div>
      </header>
      <main id="categories"></main>
      <div id="emojiContextMenu" class="emoji-context-menu emoji-context-menu-hidden">
        <button type="button" data-action="toggle-pin">Pin</button>
        <button type="button" data-action="toggle-hide">Hide</button>
        <button type="button" data-action="reset-usage">Reset usage count</button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
