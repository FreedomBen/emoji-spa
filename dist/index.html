<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unicode Emoji Picker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Unicode Emoji Picker</h1>
        <p id="status">Generating emoji list...</p>
        <div class="controls">
          <input
            id="searchInput"
            type="search"
            placeholder="Search by emoji or category…"
            autocomplete="off"
          />
          <select id="categorySelect">
            <option value="all">All categories</option>
          </select>
          <label class="toggle">
            <input id="groupByCategory" type="checkbox" checked />
            <span>Group by category</span>
          </label>
        </div>
      </header>
      <main id="categories"></main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
